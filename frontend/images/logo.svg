<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D58C"/>
      <stop offset="50%" stop-color="#C59A3F"/>
      <stop offset="100%" stop-color="#9A7220"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- SEPL Exhibition Nexus Icon -->
  <g transform="translate(10, 8)" filter="url(#glow)">
    <!-- Outer interconnected geometric planes representing exhibition pavilions -->
    <path d="M 27 0 L 49 13 L 49 39 L 27 52 L 5 39 L 5 13 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Central interlocking nexus -->
    <path d="M 27 10 L 41 18 L 41 34 L 27 42 L 13 34 L 13 18 Z" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>
    
    <!-- Dynamic converging stage rays -->
    <path d="M 27 10 L 27 42" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 13 18 L 41 34" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 13 34 L 41 18" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Central Core Jewel representing trade summit -->
    <circle cx="27" cy="26" r="4.5" fill="url(#goldGrad)"/>
    <circle cx="27" cy="26" r="2" fill="#FFFFFF"/>

    <!-- Mini satellite nodes representing exhibitors & buyers -->
    <circle cx="5" cy="26" r="2.5" fill="url(#goldGrad)"/>
    <circle cx="49" cy="26" r="2.5" fill="url(#goldGrad)"/>
    <circle cx="27" cy="0" r="2.5" fill="url(#goldGrad)"/>
    <circle cx="27" cy="52" r="2.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(74, 12)">
    <!-- SAINA -->
    <text x="0" y="26" font-family="'Outfit', 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="25" font-weight="800" letter-spacing="3.5" fill="#0F172A">
      SAINA
    </text>
    
    <!-- SEPL Badge -->
    <rect x="116" y="8" width="52" height="20" rx="4" fill="url(#goldGrad)"/>
    <text x="142" y="22" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="10" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="1.2">
      SEPL
    </text>

    <!-- EXHIBITIONS PVT. LTD. -->
    <text x="0" y="42" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="600" letter-spacing="2.8" fill="#64748B">
      EXHIBITIONS PVT. LTD.
    </text>
  </g>
</svg>
